<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form class="auth-form">
    <h1>CHAT WEBSITE</h1>

    <p id="username_title">Username</p>
    <input type="text" id="username">

    <p id="password_title">Password</p>
    <input type="password" id="password">

    <div class="actions">

    <input type="radio" id="register" name="action" value="register">
    <label for="register">Register</label>

    <input type="radio" id="login" name="action" value="login">
    <label for="login">Login</label>

    </div>
    <button type="submit" id="submitButton">Start</button>
</form>
<script src="script.js"></script>


</body>

</html>
